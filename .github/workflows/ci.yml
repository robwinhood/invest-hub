name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 빌드 환경 정책:
#   Gradle 8.14.5의 런처/데몬은 LTS인 Java 21에서 구동한다 (Gradle 8.14가 공식 인증한 JVM).
#   컴파일·테스트는 build.gradle.kts의 toolchain(Java 25)에서 수행된다.
#   setup-java에 25·21을 함께 설치하면 마지막(21)이 기본 JAVA_HOME(=런처 JVM)이 되고,
#   toolchain(25)은 gradle.properties의 fromEnv=JAVA_HOME_25_X64 로 탐지된다.
jobs:
  lint:
    name: Kotlin Format Check (Ktlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v6

      # 정적 분석 도구 정책 (GA 전용):
      #   Detekt는 채택하지 않는다 (Kotlin 2.3.21 호환 버전이 alpha뿐).
      #   포맷·스타일은 Ktlint(GA), 아키텍처·코루틴 금지·CB 누락은 ArchUnit(test 잡)이 강제한다.
      - name: Check Kotlin formatting (Ktlint)
        run: ./gradlew lintKotlin --no-daemon --stacktrace

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ArchUnit(아키텍처 경계·코루틴 금지·CB 누락 방지)도 이 테스트 잡에서 함께 실행된다.
      - name: Run tests (Kotest + ArchUnit, 117개)
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test report (실패 시)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

      - name: Build
        run: ./gradlew build -x test --no-daemon --stacktrace
