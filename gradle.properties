org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true

# Java toolchain 자동 탐지 보강.
# CI(GitHub Actions)는 Gradle 런처를 Java 21(LTS, Gradle 8.14 인증)로 구동하고,
# 컴파일·테스트 toolchain(Java 25)은 setup-java가 노출하는 JAVA_HOME_25_X64에서 찾는다.
# 로컬에는 해당 env var가 없어 무시되며(no-op) 기존 동작에 영향 없음.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
